name: CI failure issue

# main で下のワークフローが失敗したらラベル ci-failure の Issue を立て、次に成功したら閉じる（Claude は使わない）。
# 監督エージェントが毎回 API で失敗を探す代わりに、この Issue を見るだけで済むようにするためのもの。
# 中身は共通部品 satou-aaaaa/shared-workflows にある。ここには見張るワークフローの名前（name:）だけを書く。
on:
  workflow_run:
    workflows: ["test", "Secret scan", "Setup check", "CodeQL"]
    types: [completed]
  # 見回り: 6時間ごとに、見張る名前の main の最新の実行を見て Issue を立てる・閉じる（上の workflows: は1行で書く）
  schedule:
    - cron: "29 */6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  actions: read

jobs:
  report:
    uses: satou-aaaaa/shared-workflows/.github/workflows/ci-failure-issue.yml@main
